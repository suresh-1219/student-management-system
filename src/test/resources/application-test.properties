# Active only during automated tests (see AbstractIntegrationTest).
#
# The datasource itself is supplied by Testcontainers via @ServiceConnection,
# not by these properties. This file only overrides the settings that would
# otherwise require an environment variable, so `mvnw test` needs neither
# JWT_SECRET nor a running MySQL - only Docker.

jwt.secret=test-only-secret-do-not-use-in-production-1234567890

# No Redis in the test environment; @Cacheable/@CacheEvict become plain
# pass-through calls, so tests always exercise the real database.
spring.cache.type=none
