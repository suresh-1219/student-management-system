spring.application.name=student-management-system

# PROFILES
#
# With nothing chosen (a plain `mvnw spring-boot:run`) the "dev" profile is
# used: readable SQL logging. Docker Compose runs "prod" (SPRING_PROFILES_ACTIVE,
# see docker-compose.yml). Automated tests use "test". Per-profile settings live
# in application-dev.properties / application-prod.properties.
spring.profiles.default=dev

# DATABASE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/student_db}
spring.datasource.username=${DB_USERNAME:root}
# Empty default so tests (which override the datasource via Testcontainers'
# @ServiceConnection) don't fail to start just because DB_PASSWORD isn't set.
spring.datasource.password=${DB_PASSWORD:}

# JPA / HIBERNATE

# Flyway owns the schema now (see src/main/resources/db/migration).
# Hibernate must not change tables on its own.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT

jwt.secret=${JWT_SECRET}
# Short-lived on purpose: a leaked access token is only useful for this long.
# The client is expected to call /auth/refresh well before it expires.
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
# 7 days. Rotated on every use (see RefreshTokenService), so a refresh token
# living this long is safe: each one only works once.
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# SERVER

server.port=9090

# BOOTSTRAP ADMIN (created on startup only if ADMIN_PASSWORD is set)

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:}

# FLYWAY (database migrations)

spring.flyway.enabled=true
# An existing database that was created by Hibernate has no Flyway history yet.
# Treat it as already being at version 1 (the baseline) and apply V2 onwards.
# A brand-new empty database runs V1 as well.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ACTUATOR (health checks; used by Docker Compose and can back a
# Kubernetes/monitoring probe later). Only health, info and prometheus are
# exposed - no env, beans, etc, which could leak configuration. health and
# info are public; /actuator/prometheus (metrics) needs an ADMIN token
# (see SecurityConfig).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# REDIS CACHING (see CacheConfig; disabled in the test profile - tests always
# hit the real database, not a cache)

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
# Caching is a performance optimization, not a hard dependency: Redis
# being unreachable should not make the app report itself unhealthy.
management.health.redis.enabled=false

# CORS (browser frontends on other origins; see SecurityConfig).
# Comma separated. Set CORS_ALLOWED_ORIGINS to your real frontend URL(s) in
# production; the defaults are the usual local React/Vite dev servers.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# LOGGING
#
# Every log line carries the request ID (see RequestIdFilter). The "prod"
# profile switches the console to one JSON object per line instead.
logging.pattern.level=%5p [%X{requestId:-}]
