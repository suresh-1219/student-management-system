spring.application.name=student-management-system

# PROFILES
#
# With nothing chosen (a plain `mvnw spring-boot:run`) the "dev" profile is
# used: readable SQL logging. Docker Compose runs "prod" (SPRING_PROFILES_ACTIVE,
# see docker-compose.yml). Automated tests use "test". Per-profile settings live
# in application-dev.properties / application-prod.properties.
spring.profiles.default=dev

# DATABASE

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/student_db}
spring.datasource.username=${DB_USERNAME:root}
# Empty default so tests (which override the datasource via Testcontainers'
# @ServiceConnection) don't fail to start just because DB_PASSWORD isn't set.
spring.datasource.password=${DB_PASSWORD:}

# JPA / HIBERNATE

# Flyway owns the schema now (see src/main/resources/db/migration).
# Hibernate must not change tables on its own.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT

jwt.secret=${JWT_SECRET}
# Short-lived on purpose: a leaked access token is only useful for this long.
# The client is expected to call /auth/refresh well before it expires.
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
# 7 days. Rotated on every use (see RefreshTokenService), so a refresh token
# living this long is safe: each one only works once.
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# SERVER

server.port=9090

# BOOTSTRAP ADMIN (created on startup only if ADMIN_PASSWORD is set)

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.password=${ADMIN_PASSWORD:}

# FLYWAY (database migrations)

spring.flyway.enabled=true
# An existing database that was created by Hibernate has no Flyway history yet.
# Treat it as already being at version 1 (the baseline) and apply V2 onwards.
# A brand-new empty database runs V1 as well.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ACTUATOR (health checks; used by Docker Compose and can back a
# Kubernetes/monitoring probe later). Only health, info and prometheus are
# exposed - no env, beans, etc, which could leak configuration. health and
# info are public; /actuator/prometheus (metrics) needs an ADMIN token
# (see SecurityConfig).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

# REDIS CACHING (see CacheConfig; disabled in the test profile - tests always
# hit the real database, not a cache)

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
# Caching is a performance optimization, not a hard dependency: Redis
# being unreachable should not make the app report itself unhealthy.
management.health.redis.enabled=false

# RABBITMQ (see RabbitMQConfig, EventPublisher, NotificationListener)
#
# Publishing is a side effect of recording a grade/attendance entry, not the
# point of the request (see EventPublisher), so an unreachable broker never
# fails those requests. The listener's auto-startup is off by default so a
# plain `mvn spring-boot:run` (no broker running) still starts cleanly;
# docker-compose.yml turns it on, since that stack always has RabbitMQ.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTOSTART:false}
management.health.rabbit.enabled=false

# S3-COMPATIBLE OBJECT STORAGE (course syllabus files; see StorageService).
#
# Backed by a SeaweedFS S3 gateway (see docker-compose.yml), not MinIO:
# MinIO pulled its free container images from Docker Hub and quay.io, and
# its last free release has an unpatched critical CVE, so it's no longer
# run here even though the client library (io.minio:minio) - a generic
# S3-protocol client - is still what StorageService uses to talk to it.
#
# Unlike Redis/RabbitMQ above, this one is NOT marked as a soft dependency:
# an upload/download/delete request's whole point is to reach the object
# store, so a failure here fails that request (502) rather than degrading
# silently. It does not affect the app's own health check, though, the
# same way a failing database connection pool would - the object store
# being down doesn't make the rest of the API (students, grades, ...)
# stop working.
app.s3.endpoint=${S3_ENDPOINT:http://localhost:8333}
app.s3.access-key=${S3_ACCESS_KEY:course-syllabi-app}
app.s3.secret-key=${S3_SECRET_KEY:change-me-course-syllabi-secret}
app.s3.bucket=${S3_BUCKET:course-syllabi}
# How long a presigned download URL (see CourseController#getSyllabus)
# stays valid for.
app.s3.presigned-url-expiry-seconds=${S3_PRESIGNED_URL_EXPIRY_SECONDS:600}

# Matches CourseService's own 10 MB syllabus-size check: Spring rejects an
# oversized upload before it ever reaches the controller.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS (browser frontends on other origins; see SecurityConfig).
# Comma separated. Set CORS_ALLOWED_ORIGINS to your real frontend URL(s) in
# production; the defaults are the usual local React/Vite dev servers.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# LOGGING
#
# Every log line carries the request ID (see RequestIdFilter). The "prod"
# profile switches the console to one JSON object per line instead.
logging.pattern.level=%5p [%X{requestId:-}]
