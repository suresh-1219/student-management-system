# Active when SPRING_PROFILES_ACTIVE=prod (Docker Compose does this).

# No SQL echo on the console: it is noisy, slow, and can put data in the logs.
spring.jpa.show-sql=false

# One JSON object per line (includes the requestId), ready for a log
# collector such as Loki, ELK or CloudWatch. Built into Spring Boot 3.4+.
logging.structured.format.console=logstash

# On shutdown, finish requests already in flight instead of cutting them off.
server.shutdown=graceful

# Interactive API docs are a map of your API for anyone who can reach it.
# Off by default in production; set SWAGGER_ENABLED=true to turn them on
# (docker-compose.yml does, so the demo stack stays easy to try).
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
