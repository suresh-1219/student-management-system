# Brings up MySQL and the app together.
#
# Usage:
#   1. Copy .env.example to .env and fill in real values.
#   2. docker compose up --build
#
# The app is then at http://localhost:9090/swagger-ui/index.html

services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      # host:container - lets you still connect with Workbench on 3307
      - "3307:3306"
    volumes:
      - student-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No password and not exposed to the host on purpose: only the "app"
    # service on this same Docker network can reach it. Caching still works
    # even if this container is skipped or unreachable - see CacheConfig's
    # cacheErrorHandler - so Redis is a performance optimization here, not a
    # hard requirement for the app to start.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    ports:
      # Management UI only - http://localhost:15672 (guest/guest). The AMQP
      # port (5672) is reached by the app over the Docker network, not
      # exposed to the host.
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    # chrislusf/seaweedfs, not MinIO: this feature was originally built
    # against MinIO, but MinIO discontinued free container images (pulled
    # from both Docker Hub and quay.io after this project started using
    # them) and its last free release has an unpatched critical CVE, so it
    # is no longer run here at all. SeaweedFS's S3 gateway is the same S3
    # protocol StorageService already speaks (via the io.minio client
    # library, which works against any S3-compatible server), is
    # Apache-2.0, and is actively maintained.
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # Writes an S3 identity (access key/secret - matching application
    # .properties' app.s3.* defaults unless overridden below) to a config
    # file, then starts an all-in-one master+volume+filer+S3-gateway
    # process. No separate master/volume/filer containers are needed for
    # this project's scale.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs && cat > /etc/seaweedfs/s3.json <<'EOF'
        {
          "identities": [
            {
              "name": "app",
              "credentials": [
                { "accessKey": "${S3_ACCESS_KEY:-course-syllabi-app}", "secretKey": "${S3_SECRET_KEY:-change-me-course-syllabi-secret}" }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      # 8333 = the S3-compatible API the app talks to. SeaweedFS has no
      # MinIO-style web console, so there's nothing else to expose here.
      - "8333:8333"
    volumes:
      - student-object-storage-data:/data
    # No healthcheck: this image's exact toolset (wget/curl availability)
    # isn't something to guess at. StorageService already tolerates the
    # object store being briefly unavailable at startup (see
    # StorageService#ensureBucketExists), so "app" below depends on this
    # service starting, not on a health probe passing.

  app:
    build: .
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      # Inside the Docker network, MySQL, Redis, RabbitMQ and the object
      # store are reached by their service names ("db", "redis",
      # "rabbitmq", "seaweedfs") on their container ports - NOT localhost
      # (that only applies to tools like Workbench running on your own
      # machine, via the "3307:3306" port mapping above).
      DB_URL: jdbc:mysql://db:3306/student_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      S3_ENDPOINT: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-course-syllabi-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-course-syllabi-secret}
      S3_BUCKET: ${S3_BUCKET:-course-syllabi}
      # This stack always has a broker, so turn the listener on (see
      # application.properties - it's off by default for a plain
      # `mvn spring-boot:run` with no RabbitMQ running).
      RABBITMQ_LISTENER_AUTOSTART: "true"
      # "prod" = no SQL echo, JSON logs, graceful shutdown (see
      # application-prod.properties). Swagger is switched back ON here only so
      # this demo stack stays easy to try; leave it off for a real deployment.
      SPRING_PROFILES_ACTIVE: prod
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seaweedfs:
        condition: service_started

volumes:
  student-db-data:
  student-object-storage-data:
