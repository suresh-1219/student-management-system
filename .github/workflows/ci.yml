name: CI

# Runs the full test suite (including the Testcontainers-backed database
# tests - GitHub's ubuntu-latest runners have Docker preinstalled, so no
# extra setup is needed) on every push and pull request.

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

# The workflow only needs to read the code; upload-artifact needs no extra
# permission. Least privilege limits the damage if a step is ever compromised.
permissions:
  contents: read

# A newer push to the same branch makes an older, still-running CI run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Windows checkouts (and Git in general) don't preserve the Unix
      # executable bit on mvnw, so the Linux runner refuses to run it
      # ("Permission denied", exit code 126) unless we set it explicitly.
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
